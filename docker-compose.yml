services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: onlinestore
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d onlinestore"]
      interval: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=onlinestore;Username=store;Password=${DB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  pgdata: